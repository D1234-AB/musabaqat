<head>
<meta charset="UTF-8">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif}
body{background:#f1f0eb;color:#222;min-height:100vh}
header.top{position:sticky;top:0;z-index:50;background:#150a2e;color:#fff;padding:12px 16px;box-shadow:0 2px 12px #0005}
.top-in{max-width:1000px;margin:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top h1{font-size:1.2rem;font-weight:700;white-space:nowrap}
.top h1 small{color:#FFC93C}
#search{flex:1;min-width:160px;padding:10px 14px;border-radius:12px;border:0;outline:0;font-size:.95rem}
.btn{padding:10px 14px;border-radius:12px;border:0;cursor:pointer;font-weight:700;font-size:.85rem;background:#ffffff22;color:#fff;border:1px solid #ffffff33}
.btn.gold{background:#FFC93C;color:#000;border-color:#FFC93C}
main{max-width:1000px;margin:auto;padding:16px 12px 60px}
#stats{text-align:center;color:#666;font-size:.85rem;margin:6px 0 12px}
nav.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px}
nav.pills a{flex:0 0 auto;text-decoration:none;color:#fff;font-size:.8rem;font-weight:700;padding:8px 14px;border-radius:999px}
section.cat{border-radius:18px;margin-bottom:22px;overflow:hidden;background:#fff;box-shadow:0 3px 14px #0001}
.cat-head{display:flex;align-items:center;gap:12px;padding:14px 16px;color:#fff}
.cat-head h2{font-size:1.25rem}
.cat-head .count{font-size:.75rem;opacity:.85}
.cat-icon{font-size:2rem;line-height:1}
.fold{margin-inline-start:auto;background:#ffffff2e;color:#fff;border:0;border-radius:10px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:.8rem}
section.closed .q-list{display:none}
.q-list{padding:12px;display:grid;gap:10px}
article.q{border-radius:12px;padding:10px 12px;cursor:pointer}
.q-top{display:flex;gap:10px;align-items:flex-start}
.q-num{flex:0 0 auto;min-width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.q-top p{flex:1;font-weight:700;font-size:.95rem;line-height:1.7}
.dif{flex:0 0 auto;font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:999px}
ol.opts{list-style:none;margin-top:8px;display:grid;gap:6px}
ol.opts li{padding:8px 12px;border-radius:10px;font-size:.88rem;display:flex;gap:8px;align-items:center}
ol.opts li::before{content:attr(data-l);font-weight:700;font-size:.75rem;opacity:.6}
body:not(.show-answers) article.q:not(.revealed) li.ok{font-weight:400}
body:not(.show-answers) article.q:not(.revealed) li.ok .tick{display:none}
.tick{margin-inline-start:auto;font-weight:700}
body.show-answers li.ok .tick{display:inline}
article.q:not(.revealed):not(.show-answers) li.ok{border-style:dashed}
li.ok{font-weight:700}
.hint-line{font-size:.72rem;opacity:.65;margin-top:6px}
article.q.flash{outline:3px solid #FFC93C;outline-offset:2px}

.t-lang .cat-head h2{font-family:'Aref Ruqaa',serif;font-size:1.5rem}

.t-lang .q-num{background:#b45309;color:#fff}

<body>
<header class="top"><div class="top-in">
  <h1>📖 بنك الأسئلة <small>• تحدي الأبطال</small></h1>
  <input id="search" placeholder="🔍 ابحث في كل الأسئلة…">
  <button class="btn gold" id="tglAns">إظهار الإجابات</button>
  <button class="btn" id="random">🎲 عشوائي</button>
</div></header>
<main>
  <div id="stats"></div>
  <nav class="pills" id="pills"></nav>
  <div id="cats"></div>
</main>
<footer>بنك الأسئلة © 2026 • اضغط أي سؤال لكشف إجابته</footer>
<script>
(function(){
  const LET=['أ','ب','ج','د'];
  const catsEl=document.getElementById('cats'), pills=document.getElementById('pills');
  let total=0;
  CATS.forEach(c=>{
    const arr=QBANK[c.id]||[]; total+=arr.length;
    const a=document.createElement('a'); a.href='#cat-'+c.id; a.textContent=c.icon+' '+c.name;
    a.style.background=c.g; pills.appendChild(a);
    const s=document.createElement('section'); s.className='cat t-'+c.id; s.id='cat-'+c.id;
    s.innerHTML=`<header class="cat-head"><span class="cat-icon">${c.icon}</span>
      <div><h2>${c.name}</h2><div class="count">${arr.length} سؤال</div></div>
      <button class="fold">طي ⬆</button></header><div class="q-list"></div>`;
    const list=s.querySelector('.q-list');
    s.querySelector('.fold').onclick=e=>{s.classList.toggle('closed');e.target.textContent=s.classList.contains('closed')?'فتح ⬇':'طي ⬆'};
    arr.forEach((q,i)=>{
      const el=document.createElement('article'); el.className='q';
      el.dataset.text=(q.q+' '+q.o.join(' '));
      el.innerHTML=`<div class="q-top"><span class="q-num">${i+1}</span><p>${q.q}</p><span class="dif">${q.d}</span></div>
        <ol class="opts">${q.o.map((t,j)=>`<li data-l="${LET[j]}" class="${j===q.a?'ok':''}"><span>${t}</span><span class="tick">✔</span></li>`).join('')}</ol>
        <div class="hint-line">اضغط السؤال لكشف الإجابة الصحيحة</div>`;
      el.onclick=()=>el.classList.toggle('revealed');
      list.appendChild(el);
    });
    catsEl.appendChild(s);
  });
  document.getElementById('stats').textContent=`${CATS.length} فئة • ${total} سؤال • الإجابة الصحيحة عليها ✔`;
  const tgl=document.getElementById('tglAns');
  tgl.onclick=()=>{document.body.classList.toggle('show-answers');tgl.textContent=document.body.classList.contains('show-answers')?'إخفاء الإجابات':'إظهار الإجابات'};
  document.getElementById('random').onclick=()=>{
    const all=[...document.querySelectorAll('article.q')].filter(e=>e.style.display!=='none');
    if(!all.length)return; const el=all[Math.floor(Math.random()*all.length)];
    el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.add('flash');
    setTimeout(()=>el.classList.remove('flash'),1800);
  };
  document.getElementById('search').oninput=e=>{
    const v=e.target.value.trim(); let shown=0;
    document.querySelectorAll('section.cat').forEach(s=>{
      let n=0;
      s.querySelectorAll('article.q').forEach(q=>{
        const ok=!v||q.dataset.text.includes(v); q.style.display=ok?'':'none'; if(ok){n++;shown++}
      });
      s.style.display=n?'':'none';
      s.querySelector('.count').textContent=v?`${n} نتيجة`:`${s.querySelectorAll('article.q').length} سؤال`;
    });
    document.getElementById('stats').textContent=v?`نتائج البحث: ${shown} سؤال`:`${CATS.length} فئة • ${total} سؤال • الإجابة الصحيحة عليها ✔`;
  };
})();
</script>
</body>
</html>
